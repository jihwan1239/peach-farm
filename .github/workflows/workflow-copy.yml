name: 안드로이드 APK 만들기

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then URL="https://${OWNER}.github.io/"; else URL="https://${OWNER}.github.io/${REPO}/"; fi
          echo "앱이 열 주소: $URL"
          gradle -p android :app:assembleRelease -PsiteUrl="$URL" -PversionCode="${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk igane-peach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: igane-peach-apk
          path: igane-peach.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 이가네 복숭아 안드로이드 앱
          body: 이 APK는 GitHub Pages의 게임 주소를 여는 앱이에요. 웹을 수정하면 앱에도 바로 반영돼요.
          files: igane-peach.apk
          make_latest: true
