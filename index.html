<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd9c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이가네 복숭아">
<title>이가네 복숭아</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{
  --bg:#ffe3d6; --panel:#fff8ef; --ink:#5a3428; --line:#7a4a3a; --accent:#ff8a80;
  --good:#6cc35a; --gold:#e8a923;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Galmuri11','Galmuri9',system-ui,sans-serif;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
#hud{display:flex;gap:8px;align-items:center;padding:10px 2px 8px;flex-wrap:nowrap}
.stat{display:flex;align-items:center;gap:5px;background:var(--panel);padding:5px 9px 5px 7px;
  border:2px solid var(--line);border-radius:2px;box-shadow:0 2px 0 var(--line);font-size:14px;min-width:0}
.stat img{width:21px;height:21px;image-rendering:pixelated}
#clock{margin-left:auto;font-size:11px;line-height:1.3;opacity:.8;white-space:nowrap;text-align:right}
#hud{gap:5px}
.stat{flex:none}
#clock{flex:1;min-width:0}
#fName{display:flex;gap:6px;align-items:center}
#fClock{opacity:.7;padding-left:7px;border-left:1px solid #d9b8a8}
@media (max-width:380px){ #hud{gap:4px} #hud .icon{width:26px;height:30px} #hud .icon img{width:15px;height:15px} .stat{padding:4px 5px 4px 4px !important;font-size:12px;gap:3px} .stat img{width:18px;height:18px} #clock{font-size:10px} }

#hud .icon+.icon{margin-left:-2px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#box{position:relative}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;
  border:3px solid var(--line);border-radius:2px;box-shadow:0 4px 0 var(--line);touch-action:none;cursor:pointer}
#fx{position:absolute;inset:3px;pointer-events:none;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font-size:13px;white-space:nowrap;color:#fff;
  text-shadow:-1px 0 var(--line),1px 0 var(--line),0 -1px var(--line),0 1px var(--line),0 2px var(--line);
  animation:up 1s ease-out forwards}
.ft.gold{color:#ffe066}.ft.pink{color:#ffb3c7}.ft.blue{color:#bfe6ff}.ft.green{color:#c9f2a8}
@keyframes up{0%{opacity:0;margin-top:4px}15%{opacity:1}100%{opacity:0;margin-top:-26px}}
#bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 0 12px}
#bar button{font-size:13px;padding:8px 2px 7px;white-space:nowrap}
#hud .icon{background:var(--panel);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);border-radius:2px;
  width:31px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
#hud .icon img{width:18px;height:18px;image-rendering:pixelated}
.stat{padding:5px 8px 5px 6px !important}
#buffs{display:flex;gap:6px;flex-wrap:wrap;min-height:0;padding:0 2px 6px}
#buffs:empty{display:none}
.buff{display:flex;align-items:center;gap:4px;font-size:11px;background:#fff3d6;border:2px solid #d9a35a;padding:2px 7px 2px 4px;border-radius:2px}
.buff img{width:16px;height:16px;image-rendering:pixelated}
.jumak-head{display:flex;gap:10px;align-items:center;background:#fff1dc;border:2px dashed #d9a35a;padding:8px 10px;margin-bottom:6px}
.jumak-head img{width:36px;height:46px;image-rendering:pixelated}
.stamps{display:flex;gap:3px;margin-top:3px}
.stamps i{width:12px;height:12px;border:2px solid #d26a5c;border-radius:50%;display:block}
.stamps i.on{background:#d26a5c}
.eat{text-align:center;padding:14px 0 6px}
.eat img{width:120px;image-rendering:pixelated;animation:nom .45s steps(2) 3}
@keyframes nom{50%{transform:scale(1.08) rotate(-4deg)}}
.notice{background:#fff1dc;border:2px dashed #d9a35a;padding:10px 12px;margin:8px 0;line-height:1.6}
.notice[hidden]{display:none}
.wide{width:100%;flex-direction:row !important;justify-content:center;gap:8px !important;padding:12px 8px !important;font-size:15px !important;margin-top:8px}
.wide img{width:22px;height:22px;image-rendering:pixelated}
.wide.pink{background:#ffe0d8}
.acct{display:flex;align-items:center;gap:8px;margin-top:6px}
.acct code{-webkit-user-select:text;user-select:text;font-family:inherit;font-size:16px;flex:1;letter-spacing:.5px;word-break:break-all}
.farm-hero{text-align:center;padding:4px 0 6px}
.farm-hero img{width:96px;image-rendering:pixelated}
input{-webkit-user-select:text;user-select:text}
#bar button{position:relative}
#bar button.new::after{content:'';position:absolute;top:5px;right:9px;width:7px;height:7px;background:#ff5a5a;border:2px solid var(--line);border-radius:50%}
#catBtn{position:absolute;right:12px;bottom:14px;font:inherit;font-size:13px;color:var(--ink);background:#fff3d6;
  border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:6px 11px;display:flex;align-items:center;gap:5px;cursor:pointer;z-index:2;white-space:nowrap}
#catBtn[hidden]{display:none}
.fnav{position:absolute;top:55%;transform:translateY(-50%);width:30px;height:48px;padding:0;background:rgba(255,248,239,.93);border:2px solid var(--line);
  box-shadow:0 2px 0 var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.fnav img{width:12px;height:18px;image-rendering:pixelated}
.fnav[hidden]{display:none}
.fnav:active{transform:translateY(calc(-50% + 2px));box-shadow:0 0 0 var(--line)}
#fPrev{left:5px} #fNext{right:5px}
.fnav.new::after{content:'';position:absolute;top:-6px;right:-6px;width:9px;height:9px;background:#ff5a5a;border:2px solid var(--line);border-radius:50%}
#fLabel{position:absolute;top:7px;left:50%;transform:translateX(-50%);font-size:11px;background:rgba(255,248,239,.92);border:2px solid var(--line);
  padding:2px 8px;z-index:2;pointer-events:none;white-space:nowrap;display:flex;gap:6px;align-items:center}
#fLabel i{display:inline-block;width:6px;height:6px;border:1px solid var(--line);background:#fff}
#fLabel i.on{background:#ff8a80}
#fLabel[hidden]{display:none}
#fLock{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:74%;background:var(--panel);border:3px solid var(--line);
  box-shadow:0 4px 0 var(--line);padding:12px 12px 14px;text-align:center;z-index:2;font-size:13px;line-height:1.55}
#fLock[hidden]{display:none}
#fLock b{font-weight:normal;font-size:16px;display:block;margin-bottom:2px}
#fLock small{display:block;opacity:.75;margin-bottom:10px}
#fLock .btn{display:inline-flex;flex-direction:row;gap:5px;padding:8px 12px}
#fLock .btn img{width:16px;height:16px;image-rendering:pixelated}
#catBtn img{width:16px;height:16px;image-rendering:pixelated}
#catBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;font:inherit;font-size:13px;color:var(--ink);background:#f6e3d4;border:2px solid var(--line);padding:6px 0;cursor:pointer;border-radius:2px}
.tabs button.on{background:#ffcbb8}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dex div{border:2px solid #ecd0c2;background:#fff;padding:7px 2px 6px;text-align:center;font-size:12px;line-height:1.35}
.dex img{width:28px;height:32px;object-fit:contain;image-rendering:pixelated;display:block;margin:0 auto 3px}
.dex .no img{filter:brightness(0) opacity(.22)}
.dex .no{color:#b9a49a}
.dex small{display:block;opacity:.65;font-size:10px}
.att{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 10px}
.att div{border:2px solid #ecd0c2;text-align:center;font-size:10px;padding:5px 0;line-height:1.4;background:#fff}
.att div.on{background:#ffe0d8;border-color:#d26a5c}
.att div.today{background:#ffb8a8}
.badge{display:inline-block;background:#ff8a80;color:#fff;font-size:10px;padding:1px 5px;margin-left:4px;vertical-align:2px}
s.old{opacity:.5;font-size:11px;margin-right:2px}
.hearts{display:flex;gap:2px;margin:6px 0}
.hearts img{width:15px;height:12px;image-rendering:pixelated}
.hearts img.off{filter:grayscale(1) opacity(.3)}
.perk{opacity:.45;margin:3px 0}.perk.on{opacity:1}
.catcard{display:flex;gap:12px;align-items:center;background:#fff1dc;border:2px dashed #d9a35a;padding:10px}
.catcard>img{width:80px;image-rendering:pixelated}
.diary{margin-top:14px;border-top:2px dashed #e0b9a6;padding-top:8px}
.diary-e{padding:8px 0;border-bottom:1px dashed #ecd0c2}
.diary-e:last-child{border-bottom:0}
.diary-e small{opacity:.6}
.diary-e img{max-width:100%;border:2px solid var(--line);margin-top:6px;display:block}
.order{border-bottom:1px dashed #ecd0c2;padding:10px 0}
.order:last-of-type{border-bottom:0}
.order .who{font-size:14px}
.order .line{opacity:.85;font-size:12px;margin:2px 0 7px}
.order .act{display:flex;gap:7px;align-items:center}
.order .act>img{width:18px;height:20px;object-fit:contain;image-rendering:pixelated}
.order .act .btn{flex-direction:row;padding:6px 9px;font-size:13px}
.order .act .btn img{width:15px;height:15px;image-rendering:pixelated}
.order .act .skip{font:inherit;font-size:12px;opacity:.6;background:none;border:0;color:var(--ink);cursor:pointer;margin-left:auto;text-decoration:underline}
.bar{height:7px;border:2px solid var(--line);background:#fff;margin:4px 0 2px}
.bar i{display:block;height:100%;background:#ff9a80}
.cp{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #ecd0c2}
.cp:last-child{border-bottom:0}
.cp>img{width:30px;height:22px;image-rendering:pixelated;flex:none}
.cp .t{flex:1;min-width:0}
.cp .btn{flex-direction:row;padding:6px 9px;font-size:12px;white-space:nowrap}
button.buff{font:inherit;font-size:11px;color:var(--ink);cursor:pointer;position:relative}
.buff.hub{background:#ffe0d8;border-color:#d26a5c}
.buff.hub b{font-weight:normal;color:#c0504a}
.buff.hub.new::after{content:'';position:absolute;top:-5px;right:-5px;width:8px;height:8px;background:#ff5a5a;border:2px solid var(--line);border-radius:50%}
#playBtn{position:absolute;right:12px;bottom:14px;font:inherit;font-size:13px;color:var(--ink);background:#e9f7dc;border:2px solid var(--line);
  box-shadow:0 3px 0 var(--line);padding:6px 11px;display:flex;align-items:center;gap:5px;cursor:pointer;z-index:2;white-space:nowrap}
#playBtn[hidden]{display:none}
#playBtn img{width:12px;height:20px;image-rendering:pixelated}
.mg{display:block;width:100%;image-rendering:pixelated;border:2px solid var(--line);touch-action:none;background:#bfe6ff}
.mghud{display:flex;justify-content:space-between;font-size:14px;margin:0 0 6px}
.ul{padding:6px 0;border-bottom:1px dashed #ecd0c2;display:flex;gap:8px;align-items:center;text-align:left}
.ul:last-child{border-bottom:0}
.ul.lock{opacity:.45}
.ul .lvtag{flex:none;width:46px;color:#d26a5c;font-size:12px}
.ul .ok{margin-left:auto;font-size:11px;color:#4c9a48;flex:none}
.shareimg{width:100%;border:2px solid var(--line);display:block}
.letter{background:#fffaf0;border:2px solid #e8b8c0;padding:16px 14px;white-space:pre-wrap;line-height:1.85;font-size:14px;
  background-image:repeating-linear-gradient(transparent 0 25px,#f6dde2 25px 26px);animation:lt .6s ease-out}
@keyframes lt{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.ss-in{font:inherit;font-size:22px;letter-spacing:8px;text-align:center;width:150px;border:2px solid var(--line);padding:6px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
input.vol{width:100%;margin:8px 0 2px;accent-color:#ff8a80;-webkit-user-select:auto;user-select:auto}
input.vol:disabled{opacity:.4}
.dlv{display:flex;gap:3px;margin-top:4px}.dlv i{width:9px;height:9px;border:2px solid #d9a35a;background:#fff;display:block}.dlv i.on{background:#ffcf5a}
.fhead{margin:10px 0 2px;font-size:13px;color:#d26a5c}
input.name{font:inherit;font-size:14px;border:2px solid var(--line);padding:6px 8px;width:130px;background:#fff;color:var(--ink);border-radius:2px}
#bar button,.btn{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);
  border-radius:2px;box-shadow:0 3px 0 var(--line);padding:9px 4px 8px;font-size:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px}
#bar button img{width:24px;height:24px;image-rendering:pixelated}
#bar button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.45;transform:none;box-shadow:0 3px 0 var(--line)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-8px);
  background:var(--panel);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:8px 12px;
  font-size:13px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(70,35,25,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal[hidden]{display:none}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);width:100%;max-width:380px;
  max-height:84dvh;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:2px dashed #e0b9a6;font-size:16px}
.ph button{font:inherit;font-size:18px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0 4px}
#mBody{overflow:auto;padding:10px 12px 14px;font-size:13px;line-height:1.6}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #ecd0c2}
.row:last-child{border-bottom:0}
.row img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:normal;font-size:14px}
.row .t small{display:block;opacity:.7;font-size:12px;line-height:1.4}
.row .btn{flex-direction:row;padding:7px 9px;font-size:13px;white-space:nowrap}
.row .btn img{width:16px;height:16px}
.lv{color:#d26a5c;font-size:12px}
.help p{margin:0 0 8px}
.help .ico{display:flex;align-items:center;gap:8px;margin:3px 0}
.help .ico img{width:18px;height:20px;object-fit:contain;image-rendering:pixelated}
.steps{counter-reset:st;margin:6px 0 10px;padding:0;list-style:none}
.steps li{counter-increment:st;display:flex;gap:9px;align-items:flex-start;margin:7px 0;line-height:1.5}
.steps li::before{content:counter(st);flex:none;width:20px;height:20px;border:2px solid var(--line);background:#ffd9c7;
  display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.steps img{width:18px;height:18px;image-rendering:pixelated;vertical-align:-4px;margin:0 2px}
.small{font-size:12px;opacity:.75}
.danger{color:#c0392b}
@media (max-width:350px){ #hud{gap:3px} #hud .icon{width:24px} #hud .stat{padding:3px 4px 3px 3px !important;gap:2px} #hud .stat img{width:15px;height:15px} }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><img id="icCoin" alt=""><span id="coins">0</span></div>
    <div class="stat"><img id="icPeach" alt=""><span id="peaches">0</span></div>
    <div class="stat" id="goldStat" hidden><img id="icGold" alt=""><span id="golds">0</span></div>
    <div id="clock"></div>
    <button class="icon" id="bSound" aria-label="소리 설정"><img id="icSound" alt=""></button>
    <button class="icon" id="bHelp" aria-label="도움말"><img id="icHelp" alt=""></button>
    <button class="icon" id="bShare" aria-label="내 농장 자랑하기"><img id="icShare" alt=""></button>
  </header>
  <div id="buffs"></div>
  <main id="stage"><div id="box"><canvas id="game" width="160" height="256"></canvas><div id="fx"></div><button id="catBtn" hidden></button><button id="playBtn" hidden></button><button class="fnav" id="fPrev" aria-label="이전 밭"><img id="icPrev" alt=""></button><button class="fnav" id="fNext" aria-label="다음 밭"><img id="icNext" alt=""></button><div id="fLabel"><span id="fName"></span><span id="fClock"></span></div><div id="fLock" hidden></div></div></main>
  <nav id="bar">
    <button id="bShop"><img id="icShop" alt="">상점</button>
    <button id="bSell"><img id="icSell" alt="">팔기</button>
    <button id="bJumak"><img id="icJumak" alt="">주막</button>
    <button id="bReal"><img id="icReal" alt="">진짜 농장</button>
    <button id="bInfo"><img id="icInfo" alt="">수첩</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal" hidden><div class="panel"><div class="ph"><span id="mTitle"></span><button id="mClose" aria-label="닫기">×</button></div><div id="mBody"></div></div></div>

<script>
'use strict';
// ================= 설정 =================
const W = 160, H = 256;
const SAVE_KEY = 'peach-farm-v1';
const TREE_POS = [[48,104],[112,104],[48,164],[112,164],[48,224],[112,224]];
// 밭 3개 x 6자리 = 최대 18그루. 밭을 개척하면 앞 두 자리는 바로 심어져요.
const FIELDS = [
  {name:'앞밭',      cost:0,    lv:1},
  {name:'개울가 밭', cost:2500, lv:4},
  {name:'언덕 밭',   cost:8000, lv:8},
];
const SLOT_COST = [0,0,100,250,550,1100,  0,0,1250,1600,2000,2500,  0,0,3200,4000,5000,6200];
const P = i => TREE_POS[i%6];
const fieldOf = i => Math.floor(i/6);
const STAGE_MIN = [3,8,12,15];          // 단계별 성장 시간(분): 새싹→어린나무→꽃→풋열매→익음
const WATER_MIN = 90;                    // 물이 다 마르는 시간(분)
const PRUNE_MIN = 150;                   // 가지가 무성해지는 시간(분)
const PEACH_PRICE = 3, GOLD_PRICE = 30;

// ===== 실제 복숭아 농장 정보 (여기만 바꾸면 돼요) =====
const REAL_FARM = {
  name: '우리 복숭아 농장',                 // 지인분 농장 이름
  intro: '이 게임 속 복숭아밭은 실제로 복숭아나무를 키우고 있는 농장에서 시작됐어요. 올해 막 어린 나무를 심었답니다.',
  shopUrl: '',                              // 판매 페이지 주소가 생기면 여기에 넣어요 (예: 'https://smartstore.naver.com/...')
  comingSoon: '진짜 복숭아나무는 아직 열심히 자라는 중이에요. 다 익으면 여기서 바로 주문할 수 있게 알려드릴게요!',
  bank: '케이뱅크',                           // 은행 이름
  account: '100200158316',              // 계좌번호
  holder: '김지환',                         // 예금주
  thanks: '시원한 냉수 한 잔 감사히 받을게요. 복숭아 잘 키워 볼게요!',

function newTree(unlocked){ return {u:unlocked, stage:0, growth:0, water:70, prune:0, fruit:0, golden:false, petCd:0, born:Date.now(), harvests:0}; }
function newState(){
  const trees = []; for(let i=0;i<FIELDS.length*6;i++) trees.push(newTree(i<2));
  return {coins:20, peaches:0, gold:0, trees, up:{spr:0,scare:0,fert:0},
    stats:{harvest:0,cats:0,birds:0,gold:0,water:0,prune:0}, last:Date.now(), muted:false, seenHelp:false,
    buff:{grow:0,gold:0,bonus:0}, jumak:{stamps:0,eaten:{}}};
}

function levelOf(xp){ let lv=1, rest=xp||0; while(rest>=XP_NEED(lv) && lv<99){ rest-=XP_NEED(lv); lv++; } return {lv, cur:rest, need:XP_NEED(lv)}; }
function normalize(S){
  S.buff = S.buff || {grow:0,gold:0,bonus:0}; S.jumak = S.jumak || {stamps:0,eaten:{}};
  if(!S.inv){ S.inv = {baekdo: S.peaches||0}; }
  delete S.peaches;
  S.dex = S.dex || {};
  if(S.stats.harvest>0 && !Object.keys(S.dex).length) S.dex.baekdo = S.stats.harvest;
  if(S.stats.gold>0 && !S.dex.gold) S.dex.gold = S.stats.gold;
  S.cat = S.cat || {aff:0, name:'', fed:0};
  S.att = S.att || {last:'', count:0};
  S.orders = S.orders || []; S.orderNext = S.orderNext || 0;
  S.deco = S.deco || {}; for(const k in S.deco) if(S.deco[k]===true) S.deco[k]=1;
  while(S.trees.length < FIELDS.length*6) S.trees.push(newTree(false));
  S.trees.forEach(t=>{ if(t.u && !t.born) t.born = S.last || Date.now(); t.harvests = t.harvests||0; });
  S.up.bee = S.up.bee||0; S.honeyAt = S.honeyAt||0; S.evtSeen = S.evtSeen||{}; S.coupon = S.coupon||{};
  if(S.xp===undefined){ S.xp = (S.stats.harvest||0) + (S.stats.orders||0)*15 + (S.stats.bugs||0); S.lvSeen = levelOf(S.xp).lv; }
  S.lvSeen = S.lvSeen || 1; S.mini = S.mini || {day:'', plays:0, best:0};
  S.fields = S.fields || 1; S.curField = S.curField===FIELDS.length ? S.curField : Math.min(S.curField||0, S.fields);
  S.diarySeen = S.diarySeen || ''; S.shopNotice = S.shopNotice || '';

  return S;
}

function spr(rows, pal){
  const h=rows.length, w=rows[0].length, c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const ch=rows[y][x]; if(ch!=='.' && pal[ch]){ g.fillStyle=pal[ch]; g.fillRect(x,y,1,1);} }
  return c;
}
function flip(src){ const c=document.createElement('canvas'); c.width=src.width; c.height=src.height;
  const g=c.getContext('2d'); g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0); return c; }

const LEAF = {o:'#2f5d34', f:'#6cc35a', h:'#a8e37f', s:'#4c9a48'};
const LEAF_DRY = {o:'#6b5a2a', f:'#c8b85a', h:'#e6d98a', s:'#a18f40'};
const BLOSSOM = [[-6,-27],[3,-30],[8,-22],[-10,-20],[-2,-21],[6,-15],[-6,-14],[11,-17],[0,-25],[-12,-24],[4,-26],[-3,-16]];
const treeCache = {};
function buildTree(stage, dry, messy, sea){
  const c=document.createElement('canvas'); c.width=48; c.height=50; const g=c.getContext('2d');
  const ox=24, oy=48, P = dry?LEAF_DRY:(LEAF_S[sea]||LEAF);
  const rect=(x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(ox+x,oy+y,w,h); };
  if(stage===0){
    rect(0,-7,1,7,P.s);
    rect(-4,-10,4,2,P.f); rect(-4,-10,1,1,P.o); rect(-1,-9,1,1,P.s);
    rect(1,-11,4,2,P.f); rect(4,-11,1,1,P.o); rect(1,-10,1,1,P.s);
    rect(-3,-9,2,1,P.h); rect(2,-11,2,1,P.h);
    return c;
  }
  const th = stage===1?11:15, tw = stage===1?2:3, tx = -Math.floor(tw/2);
  rect(tx-1,-th,tw+2,th,'#5b3925'); rect(tx,-th,tw,th,'#8b5a3c'); rect(tx,-th,1,th,'#a8714c');
  rect(tx-3,-1,3,1,'#5b3925'); rect(tx+tw,-1,3,1,'#5b3925');
  const discs = stage===1 ? [[0,-17,6],[-5,-13,4],[5,-13,4]]
                          : [[0,-26,8],[-8,-21,7],[8,-21,7],[-4,-16,6],[4,-16,6]];
  if(messy){
    const twigs = stage===1 ? [[-8,-18,-12,-23],[8,-18,12,-22],[0,-23,1,-27]]
                            : [[-12,-27,-17,-33],[12,-28,16,-35],[-14,-15,-20,-14],[14,-14,20,-11],[0,-34,1,-40]];
    for(const [x1,y1,x2,y2] of twigs){
      const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1));
      for(let i=0;i<=n;i++){ rect(Math.round(x1+(x2-x1)*i/n), Math.round(y1+(y2-y1)*i/n), 1,1,'#6b4430'); }
      rect(x2-1,y2-1,3,2,P.f); rect(x2,y2-2,1,1,P.f); rect(x2-1,y2+1,1,1,P.o);
    }
  }
  const disc=(cx,cy,r,shade)=>{
    for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++){
      if(x*x+y*y > r*r+r*0.6) continue;
      let col = P.o;
      if(shade){ const l = -(x/r)*0.6 - (y/r)*0.8; col = l>0.5?P.h : l<-0.45?P.s : P.f; }
      rect(cx+x,cy+y,1,1,col);
    }
  };
  for(const [x,y,r] of discs) disc(x,y,r+1,false);
  for(const [x,y,r] of discs) disc(x,y,r,true);
  if(stage===2 && !dry){
    for(const [x,y] of BLOSSOM){ rect(x-1,y,3,1,'#ffb3cf'); rect(x,y-1,1,3,'#ffb3cf'); rect(x,y,1,1,'#fff6c9'); }
  }
  if(stage===3){
    for(const [x,y] of FRUIT_POS.slice(0,5)){ rect(x-1,y-1,2,2,'#c4e67c'); rect(x-1,y-1,1,1,'#e9f7b8'); rect(x,y,1,1,'#8fbf4a'); }
  }
  return c;
}
function treeImg(stage, dry, messy, sea){
  sea = sea || curSeason;
  const key=stage+'_'+(dry?1:0)+'_'+(messy?1:0)+'_'+sea;
  return treeCache[key] || (treeCache[key]=buildTree(stage,dry,messy,sea));
}

// ================= 배경음악 (직접 작곡한 오리지널 칩튠, 코드로 연주) =================
// 한 칸 = 8분음표. '-'는 앞 음을 늘림, '.'는 쉼표. 16마디 반복.
const SONG_MEL = (
  'A4 . C5 . A4 G4 F4 . | D4 - F4 - A4 - G4 . | F4 G4 A4 . Bb4 A4 G4 . | E4 - G4 - C5 - - . |' +
  'A4 . C5 . D5 C5 A4 . | C5 - A4 - E4 - G4 . | F4 . G4 . A4 G4 F4 D4 | E4 - G4 E4 F4 - - . |' +
  'D5 - C5 - Bb4 - A4 . | C5 - A4 - F4 - A4 . | Bb4 A4 G4 . D4 . G4 . | C5 - Bb4 - A4 - G4 . |' +
  'D5 . F5 . D5 C5 Bb4 . | A4 . C5 . A4 G4 F4 . | G4 . A4 . Bb4 . E4 . | F4 - - - . . . .'
).replace(/\|/g,' ').trim().split(/\s+/);
const SONG_BASS = ['F2','D2','Bb1','C2','F2','A1','Bb1','C2','Bb1','F2','G1','C2','Bb1','F2','G1','F2'];
function noteHz(n){ const m=n.match(/^([A-G])(b|#)?(\d)$/);
  const st={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
  return 440*Math.pow(2,((+m[3]+1)*12+st-69)/12); }
const BGM = {timer:null, step:0, next:0, out:null, noise:null};
function audioCtx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function bgmVoice(type,f,t,d,vol,lp){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  if(lp){ const fl=actx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; o.connect(fl).connect(g); } else o.connect(g);
  g.connect(BGM.out); o.start(t); o.stop(t+d+0.03);
}
function bgmStep(i,t,sd){
  const ph=skyPhase(), night=ph==='night', winter=curSeason==='winter';
  const tok=SONG_MEL[i];
  if(tok!=='.' && tok!=='-'){
    let len=1; while(SONG_MEL[(i+len)%SONG_MEL.length]==='-') len++;
    const f=noteHz(tok);
    if(night) bgmVoice('triangle',f,t,len*sd*0.95,0.11);
    else if(winter){ bgmVoice('sine',f*2,t,Math.min(1.2,len*sd*1.6),0.05); bgmVoice('sine',f,t,len*sd*0.9,0.04); }
    else { bgmVoice('square',f,t,len*sd*0.85,0.028,2400); bgmVoice('triangle',f*2,t,0.08,0.012); }
  }
  const bar=Math.floor(i/8), b=i%8, root=noteHz(SONG_BASS[bar]);
  if(night ? (b===0||b===4) : b%2===0){
    const f = (b===2||b===6) ? root*1.5 : root;
    bgmVoice('triangle',f*2,t,sd*(night?3.5:1.7),night?0.07:0.07);
  }
  if(!night && !winter){
    if(b===0||b===4){ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine';
      o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
      g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.14); o.connect(g).connect(BGM.out); o.start(t); o.stop(t+0.16); }
    if(b%2===1){ const n=actx.createBufferSource(), g=actx.createGain(), hp=actx.createBiquadFilter();
      n.buffer=BGM.noise; hp.type='highpass'; hp.frequency.value=7000;
      g.gain.setValueAtTime(0.018,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
      n.connect(hp).connect(g).connect(BGM.out); n.start(t); n.stop(t+0.05); }
  }
}
function bgmTick(){
  if(!actx || actx.state!=='running') return;
  const night=skyPhase()==='night', sd=60/(night?72:104)/2;
  if(BGM.next < actx.currentTime) BGM.next = actx.currentTime+0.05;
  while(BGM.next < actx.currentTime+0.15){ bgmStep(BGM.step,BGM.next,sd); BGM.next+=sd; BGM.step=(BGM.step+1)%SONG_MEL.length; }
}
function bgmStart(){
  if(S.bgmOff || BGM.timer) return;
  try{
    audioCtx();
    if(!BGM.noise){ const len=actx.sampleRate*0.1, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
      for(let k=0;k<len;k++) d[k]=Math.random()*2-1; BGM.noise=buf; }
    BGM.out=actx.createGain(); BGM.out.gain.setValueAtTime(0.0001,actx.currentTime);
    BGM.out.gain.exponentialRampToValueAtTime(Math.max(.0002,0.9*bgmVol()),actx.currentTime+1.5); BGM.out.connect(actx.destination);
    BGM.next=actx.currentTime+0.1; BGM.timer=setInterval(bgmTick,30);
  }catch(e){}
}
function bgmStop(){
  if(!BGM.timer) return; clearInterval(BGM.timer); BGM.timer=null;
  const o=BGM.out; try{ o.gain.cancelScheduledValues(actx.currentTime); o.gain.setValueAtTime(o.gain.value,actx.currentTime);
    o.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.4); setTimeout(()=>o.disconnect(),600); }catch(e){}
}

function hash32(n){ n=(n^61)^(n>>>16); n=(n+(n<<3))|0; n=n^(n>>>4); n=Math.imul(n,0x27d4eb2d); n=n^(n>>>15); return (n>>>0)/4294967296; }

  const h=Math.floor(ms/3600000), m=ms-h*3600000;
  if(hash32(h*7+1)<0.14) return 'rain';
  if(hash32((h-1)*7+1)<0.14 && m<25*60000 && hash32(h*7+3)<0.7) return 'rainbow';
  return 'clear';
}

let simNow = Date.now();
function growTrees(dt, catIdx){
  const growBuff = simNow < S.buff.grow ? 1.5 : 1;
  const raining = weatherAt(simNow)==='rain';
  const bugTrees = new Set(bugs.map(b=>b.tree));
  const decay = 100/(WATER_MIN*60) * (1-0.2*S.up.spr);
  for(let i=0;i<S.trees.length;i++){
    const t=S.trees[i]; if(!t.u) continue;
    const catHere = i===catIdx;
    t.water = raining ? 100 : Math.max(0, t.water - dt*decay*(catHere?3:1));
    if(t.stage>=1) t.prune = Math.min(100, t.prune + dt*100/(PRUNE_MIN*60));
    if(t.petCd>0) t.petCd-=dt;
    if(t.stage<4){
      let rate = 100/(STAGE_MIN[t.stage]*60) * (1+0.25*S.up.fert) * growBuff;
      if(bugTrees.has(i)) rate*=0.5;
      if(t.water<=0 || catHere) rate=0;
      if(t.prune>=50) rate*=0.4;
      t.growth += rate*dt;
      if(t.growth>=100) advance(t);
    }
  }
}
function advance(t){
  t.growth=0; t.stage++;
  if(t.stage===4){ t.fruit = irand(4,6) + (t.prune<30?1:0) + treeLevel(t).bonus + (S.up.bee?1:0);
    const gch = 0.06 * ((simNow < S.buff.gold ? 2 : 1) + (weatherAt(simNow)==='rainbow' ? 1 : 0));
    t.golden = Math.random() < gch;
    t.variety = pickVariety(t); t.pets = 0; }
}
function simulate(sec){
  sec=Math.min(sec, 3*86400);
  let ripeBefore=S.trees.filter(t=>t.u&&t.stage===4).length;
  simNow = Date.now() - sec*1000;
  while(sec>0){ const st=Math.min(30,sec); growTrees(st,-1); ranchTick(st,false); sec-=st; simNow += st*1000; }
  simNow = Date.now();
  return {ripe:S.trees.filter(t=>t.u&&t.stage===4).length - ripeBefore,
          thirsty:S.trees.filter(t=>t.u&&t.water<35).length};

  if(S.cat.aff>=80 && Math.random()<0.08) return 'catpeach';
  if((t.pets||0)>=3 && Math.random()<0.25) return 'heart';
  const pool = VARIETIES.filter(v=>v.seasons.includes(curSeason));
  let r = Math.random()*pool.reduce((a,v)=>a+v.w,0);

}

      let p; do{ p=irand(0,PERCH.length-1) }while(used.has(p) && used.size<PERCH.length); used.add(p);
      const fromL=Math.random()<.5;
      birds.push({x:fromL?-10:W+10, y:rand(4,30), tx:P(ti)[0]+PERCH[p][0], ty:P(ti)[1]+PERCH[p][1],
        tree:ti, state:'fly', timer:0, a:rand(0,6), dir:fromL?0:1});
    }
    toast('새가 복숭아를 노려요! 톡 눌러서 쫓아주세요');
  } else {
    const fromL=Math.random()<.5;
    birds.push({x:fromL?-10:W+10, y:rand(4,24), tx:rand(20,140), ty:43, tree:-1, state:'fly', timer:0, a:0, dir:fromL?0:1});
  }
  sfx('chirp');
}
function updateBirds(dt){
  for(const b of birds){
    b.a += dt;
    if(b.state==='fly'){
      const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy), sp=48*dt;
      b.dir = dx<0?1:0;
      if(d<=sp){ b.x=b.tx; b.y=b.ty; b.state = b.tree>=0?'peck':'rest'; b.timer = b.tree>=0?rand(5,7):rand(10,16); }
      else { b.x+=dx/d*sp; b.y+=dy/d*sp + Math.sin(b.a*10)*0.3; }
    } else if(b.state==='peck'){
      b.timer-=dt;
      if(b.timer<=0){
        const t=S.trees[b.tree];
        if(t.stage===4 && t.fruit>0 && !t.bag){
          t.fruit--; floatText(b.x,b.y-6,'냠','pink'); burst(b.x,b.y,'spark',3);
          if(t.fruit===0){ t.stage=2; t.growth=0; t.golden=false; toast('새가 복숭아를 다 먹어버렸어요 ㅠㅠ'); }
          if(t.fruit===1 && t.golden){ /* 황금 복숭아는 맨 마지막 */ }
          b.timer=rand(5,7);
        } else flee(b,false);
      }
    } else if(b.state==='rest'){
      b.timer-=dt; if(b.timer<=0) flee(b,false);
    } else if(b.state==='flee'){
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy-=10*dt;
    }
  }
  birds = birds.filter(b=>!(b.state==='flee' && (b.x<-20||b.x>W+20||b.y<-20)));
}
function flee(b, scared){
  b.state='flee'; b.dir = b.x<W/2?1:0; b.vx = b.dir?-75:75; b.vy=-45;
  if(scared){ S.stats.birds++; S.coins+=1; floatText(b.x,b.y-8,'짹! +1','gold'); burst(b.x,b.y,'feather',4); sfx('chirp'); }
}

function updateVisitors(dt){

    if(v.type==='butterfly'){ v.x+=13*dt; v.y+=Math.sin(v.a*2.6)*0.5; }

    if(v.type==='butterfly' && Math.hypot(v.x-x,v.y-y)<11){ visitors=visitors.filter(o=>o!==v); S.coins+=15; S.stats.bfly=(S.stats.bfly||0)+1; gainXP(5);
      floatText(v.x,v.y-6,'황금 나비 +15','gold'); burst(v.x,v.y,'spark',10); sfx('coin'); buzz(15); return true; }
    if(v.type==='coin' && Math.hypot(v.x-x,v.y-3-y)<10){ visitors=visitors.filter(o=>o!==v); const c=irand(5,20); S.coins+=c; gainXP(2);

    while(have.length<want[k]){ const [x,y]=penPos(); const a={kind:k, x, y, tx:x, ty:y, t:rand(0,3), a:rand(0,6), dir:Math.random()<.5?0:1, hop:0, pet:0, col:have.length%2, peck:0}; ranchAn.push(a); have.push(a); }
    while(have.length>want[k]){ const a=have.pop(); ranchAn=ranchAn.filter(o=>o!==a); }
  }
}
function layEgg(live){
  const R=S.ranch, hens=ranchAn.filter(a=>a.kind==='hen');
  let x,y; if(live && hens.length){ const h=hens[irand(0,hens.length-1)]; x=clamp(h.x+(h.dir?5:-5),PEN.x0,PEN.x1); y=clamp(h.y,PEN.y0,PEN.y1); } else [x,y]=penPos();
  const g = Math.random()<RANCH.goldEggChance;
  R.eggs.push({x:Math.round(x), y:Math.round(y), g});
  if(live && isRanch()){ floatText(x,y-12,'꼬꼬댁!',''); burst(x,y,'spark',4); sfx('cluck'); }
}
function ranchTick(dt, live){
  const R=S.ranch; if(!R.open) return;
  if(R.hens>0 && R.feed>0){
    R.feed=Math.max(0, R.feed - dt*R.hens*100/(4*RANCH.feedHours*3600));
    if(!snakeAtCoop()) R.eggT += dt*R.hens/eggSec();
    while(R.eggT>=1){ R.eggT-=1; if(R.eggs.length<RANCH.maxEggs) layEgg(live); }
  }
  if(R.rabbits>0 && R.carrot>0){
    R.carrot=Math.max(0, R.carrot - dt*100/(RANCH.carrotHours*3600));
    R.cloverT += dt*R.rabbits/(RANCH.cloverMin*60);
    while(R.cloverT>=1){ R.cloverT-=1; if(R.clovers.length<4){ const [x,y]=penPos(); R.clovers.push({x:Math.round(x), y:Math.round(y)});
      if(live && isRanch()){ floatText(x,y-10,'깡총, 찾았다!','green'); burst(x,y,'spark',4); } } }
  }
}
function updateAnimals(dt){
  syncAnimals();
  const scared = pests.some(p=>p.field===RANCH_F && p.kind==='snake' && p.state!=='out');
  for(const a of ranchAn){
    a.a+=dt; a.t-=dt; if(a.pet>0) a.pet-=dt; if(a.peck>0) a.peck-=dt;
    if(a.t<=0){
      if(scared && a.kind==='hen'){ [a.tx,a.ty]=penPos(); a.t=rand(.4,1); }
      else if(Math.random()<.55){ [a.tx,a.ty]=penPos(); a.t=rand(3,7); }
      else { a.t=rand(2,5); if(a.kind==='hen') a.peck=rand(.8,1.6); }
    }
    const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy), sp=(a.kind==='hen'?(scared?42:11):22)*dt;
    a.moving = d>0.5;
    if(a.moving){ if(Math.abs(dx)>0.3) a.dir=dx<0?1:0; if(d<=sp){ a.x=a.tx; a.y=a.ty; } else { a.x+=dx/d*sp; a.y+=dy/d*sp; } }
    a.hop = a.kind==='rabbit' && a.moving ? a.hop+dt*8 : 0;
  }
}

function tapRanch(x,y){
  const R=S.ranch; if(!R.open) return false;
  for(const e of R.eggs){ if(Math.hypot(e.x-x,e.y-2-y)<8){
    R.eggs=R.eggs.filter(o=>o!==e); const c=e.g?RANCH.goldEggCoins:RANCH.eggCoins; S.coins+=c; S.stats.eggs=(S.stats.eggs||0)+1; if(e.g) S.stats.goldEggs=(S.stats.goldEggs||0)+1;
    gainXP(e.g?5:1); floatText(e.x,e.y-8,(e.g?'황금 달걀 +':'달걀 +')+c, 'gold'); burst(e.x,e.y,'spark',e.g?10:4); sfx('coin'); buzz(10); save(); updHud(); return true; } }
  for(const c of R.clovers){ if(Math.hypot(c.x-x,c.y-2-y)<8){
    R.clovers=R.clovers.filter(o=>o!==c); S.coins+=RANCH.cloverCoins; S.stats.clovers=(S.stats.clovers||0)+1;
    S.buff.gold=Math.max(Date.now(),S.buff.gold)+RANCH.cloverLuckMin*60000; gainXP(3); renderBuffs();
    floatText(c.x,c.y-8,`네잎클로버! +${RANCH.cloverCoins}`,'green'); burst(c.x,c.y,'spark',10); sfx('buy'); buzz(15);
    if((S.stats.clovers||0)<=2) toast(`행운이 찾아왔어요! ${RANCH.cloverLuckMin}분 동안 황금 복숭아가 잘 열려요`,3200);
    save(); updHud(); return true; } }
  let best=null, bd=8;
  for(const a of ranchAn){ const d=Math.hypot(a.x-x,a.y-4-y); if(d<bd){ bd=d; best=a; } }
  if(best){ best.pet=1; best.t=rand(2,4); best.tx=best.x; best.ty=best.y; burst(best.x,best.y-8,'heart',2);
    if(best.kind==='hen'){ floatText(best.x,best.y-14,'꼬꼬','pink'); sfx('cluck'); best.peck=0.6; }
    else { floatText(best.x,best.y-14,'깡총','pink'); sfx('pet'); best.hop=0.01; const [nx,ny]=penPos(); best.tx=clamp(best.x+(nx>best.x?14:-14),PEN.x0,PEN.x1); best.ty=clamp(best.y+rand(-6,6),PEN.y0,PEN.y1); }
    return true; }
  if(R.hens && x>60 && x<98 && y>206 && y<224){ fillFeed(); return true; }
  if(R.rabbits && x>126 && x<141 && y>86 && y<101){ fillCarrot(); return true; }
  if(x>28 && x<60 && y>64 && y<102){ renderRanch(); return true; }
  if(x>98 && x<128 && y>70 && y<102){ if(R.rabbits) fillCarrot(); else renderRanch(); return true; }
  return false;
}
function ranchNeeds(){
  const R=S.ranch; if(!R.open) return false;

function pestMove(p,tx,ty,step){
  const dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy);
  if(Math.abs(dx)>0.5) p.dir=dx<0?1:0;
  if(d<=step){ p.x=tx; p.y=ty; return true; }
  p.x+=dx/d*step; p.y+=dy/d*step; return false;
}
function pestLeave(p){ p.state='out'; p.tx=p.x<W/2?-20:W+20; p.ty=p.y; }
function pestBite(p){
  const T=p.target, R=S.ranch;

    if(T.type==='egg'){ if(R.eggs.includes(T.egg)){ R.eggs=R.eggs.filter(e=>e!==T.egg); floatText(p.x,p.y-8,'달걀 슝!','pink'); toast('쥐가 달걀을 물고 도망갔어요'); } }

    else { const t=S.trees[T.i]; if(t.stage===4 && t.fruit>1 && !t.bag){ t.fruit--; floatText(p.x,p.y-8,'갉작갉작','pink'); toast('쥐가 복숭아 하나를 갉아 먹었어요'); } }
    pestLeave(p);

function tapPest(x,y){

function updatePests(dt){
  if(pestsOn() && S.seenHelp && modalIdle()){
    mouseTimer-=dt; if(mouseTimer<=0){ spawnMouse(); mouseTimer=rand(...PESTS.mouseEvery); }
    snakeTimer-=dt; if(snakeTimer<=0){ spawnSnake(); snakeTimer=rand(...PESTS.snakeEvery); }
  }
  for(const p of pests){
    p.a+=dt; p.age+=dt; if(p.recoil>0) p.recoil-=dt;
    if(p.state==='in'){
      if(p.target.type==='egg' && !S.ranch.eggs.includes(p.target.egg)){ const e=S.ranch.eggs[0]; if(e){ p.target.egg=e; p.target.x=e.x+(e.x<80?-7:7); p.target.y=e.y; } else pestLeave(p); }
      if(p.state==='in' && pestMove(p,p.target.x,p.target.y,(p.kind==='mouse'?46:15)*dt)){ p.state='eat'; p.timer=p.kind==='mouse'?6:(p.target.type==='coop'?12:40); }
    } else if(p.state==='eat'){ p.timer-=dt; if(p.timer<=0) pestBite(p); }
    else pestMove(p,p.tx,p.ty,(p.kind==='mouse'?85:42)*dt);

function treeAt(x,y){
  if(curField>=S.fields) return -1;
  for(let k=0;k<6;k++){ const [tx,ty]=TREE_POS[k]; if(x>tx-17&&x<tx+17&&y>ty-42&&y<ty+7) return curField*6+k; }
  return -1;
}
function nextSlot(){
  for(let i=0;i<S.fields*6;i++) if(!S.trees[i].u) return {kind:'slot', i, cost:SLOT_COST[i]};
  if(S.fields<FIELDS.length) return {kind:'field', f:S.fields, cost:FIELDS[S.fields].cost};
  return null;
}
function buySlot(i){
  const c=SLOT_COST[i]; if(S.coins<c){ toast(`새 나무 자리는 ${c}코인이 필요해요`); sfx('no'); return false; }
  S.coins-=c; S.trees[i]=newTree(true); sfx('buy'); toast(`${FIELDS[fieldOf(i)].name}에 새 복숭아나무를 심었어요`); save(); return true;
}
function buyField(){
  if(S.fields>=FIELDS.length) return;
  const n={f:S.fields, cost:FIELDS[S.fields].cost};
  if(farmLv()<(FIELDS[n.f].lv||1)){ toast(`농장 레벨 ${FIELDS[n.f].lv}부터 ${FIELDS[n.f].name}을 개척할 수 있어요`); sfx('no'); return; }
  if(S.coins<n.cost){ toast(`${FIELDS[n.f].name}을 개척하려면 ${n.cost}코인이 필요해요`); sfx('no'); return; }
  S.coins-=n.cost; S.fields++; S.trees[n.f*6]=newTree(true); S.trees[n.f*6+1]=newTree(true);
  sfx('buy'); buzz(25); toast(`${FIELDS[n.f].name}을 개척했어요! 나무 두 그루를 심었어요`,3000); gainXP(30);
  if(curField===n.f) for(const k of [0,1]){ const [x,y]=TREE_POS[k]; burst(x,y,'spark',12); }
  save(); updHud(); updField();
}
function tapTree(i){
  const t=S.trees[i], [x,y]=P(i);
  if(!t.u){
    const n=nextSlot();
    if(!n || n.kind!=='slot' || n.i!==i){ toast('앞쪽 자리부터 차례로 열 수 있어요'); return; }
    if(buySlot(i)){ burst(x,y,'spark',10); floatText(x,y-14,'새싹 심기!','green'); }
    return;
  }
  t.shake=.35;
  if(snakeOnTree(i)){ floatText(x,y-34,'뱀이 무서워요!',''); toast('나무 밑에 뱀이 있어서 다가갈 수가 없어요. 뱀을 세 번 톡톡 눌러 쫓아 주세요'); sfx('no'); return; }
  if(t.stage===4 && t.fruit>0){
    const g = t.golden?1:0; let n=t.fruit-g; const vid = VAR[t.variety]?t.variety:'baekdo';
    let extra = 0; if(S.buff.bonus>0){ extra=2; n+=2; S.buff.bonus--; }
    let bagged=0; if(t.bag){ bagged=2; n+=2; }
    const harvBefore=S.stats.harvest;
    S.inv[vid]=(S.inv[vid]||0)+n; S.gold+=g; S.stats.harvest+=t.fruit+extra+bagged; S.stats.gold+=g;
    const lvBefore=treeLevel(t).i; t.harvests=(t.harvests||0)+1; const lvAfter=treeLevel(t);
    if(lvAfter.i>lvBefore) setTimeout(()=>toast(`${treeName(i)}가 ${lvAfter.name}로 자랐어요! 이제 복숭아가 ${lvAfter.bonus}개 더 열려요`,3800),600);
    discover(vid,n); if(g) discover('gold',g); gainXP(n+g); checkFairy(harvBefore);
    birds.forEach(b=>{ if(b.tree===i && b.state!=='flee') flee(b,false); });
    floatText(x,y-30,`+${n} ${aprilFools()?'사과?!':VAR[vid].name}`+(g?' +황금!':'')+(bagged?' (봉지 덕분)':extra?' (새우 덕분)':''), g?'gold':'pink');
    burst(x,y,'spark',10); sfx('harvest'); buzz(20);
    t.stage=2; t.growth=0; t.fruit=0; t.golden=false; t.variety=null; t.bag=false;
  } else if(stakeNeeded(t)){
    t.staked=true; S.stats.stakes=(S.stats.stakes||0)+1; burst(x,y,'dust',8); floatText(x,y-34,'지지대 쿵!','green'); sfx('cut'); buzz(15);
  } else if(t.water<70){
    t.water=100; S.stats.water++; burst(x,y,'water',16); floatText(x,y-34,'촉촉','blue'); sfx('water');
  } else if(t.stage>=1 && t.prune>=35){
    t.prune=0; S.stats.prune++; burst(x,y,'leaf',12); floatText(x,y-34,'싹둑','green'); sfx('cut');
  } else if(t.stage===3 && !t.bag){
    t.bag=true; S.stats.bags=(S.stats.bags||0)+1; floatText(x,y-34,'봉지 씌우기','');  burst(x,y-20,'spark',5); sfx('pet');
    if(S.stats.bags<=2) setTimeout(()=>toast('봉지를 씌운 복숭아는 새가 못 먹고, 수확할 때 2개 더 얻어요'),300);
  } else if(t.petCd<=0){
    if(t.stage<4){ t.growth=Math.min(99,t.growth+5); }
    t.petCd=15; t.pets=(t.pets||0)+1; burst(x,y-20,'heart',3); floatText(x,y-34,'쑥쑥','pink'); sfx('pet');
  } else {
    floatText(x,y-34, STAGE_NAME[t.stage]+(t.stage<4?' '+Math.floor(t.growth)+'%':''), '');
  }
  save();
}

function soil(x,y,wet,locked){

  for(let k=0;k<ws.length;k++){ const w=ws[k], yy=y-2+k;
    ctx.fillStyle = locked?'#b9a58a':'#5e3a26'; ctx.fillRect(x-w-1,yy,w*2+2,1);
    ctx.fillStyle = locked?'#d8c6a8': (wet?'#7a4a2e':'#a86f42'); ctx.fillRect(x-w,yy,w*2,1); }
  ctx.fillStyle = locked?'#b9a58a':'#5e3a26'; ctx.fillRect(x-7,y-3,14,1); ctx.fillRect(x-7,y+4,14,1);
  if(!locked && !wet){ ctx.fillStyle='#c78a56'; ctx.fillRect(x-6,y,2,1); ctx.fillRect(x+3,y+1,3,1); }
}
function drawNum(n,x,y){ const s=String(n); let cx=x-Math.floor((s.length*4-1)/2); for(const ch of s){ ctx.drawImage(digits[ch],cx,y); cx+=4; } }
function bubble(x,y,icon,t){

  ctx.fillStyle='#fffaf3'; ctx.fillRect(bx-1,by+6,1,1);

}

      <p class="small">${name}에서 열리면 이 안내가 다시 떠요. 거기서 홈 화면에 추가하면 돼요.</p>${later}`;

      <ol class="steps">
        <li><span>${chrome?'주소창 오른쪽':'화면 아래(또는 주소창 옆)'}의 공유 버튼 <img src="${asURL(icShare)}" alt="">을 눌러요. 안 보이면 <b>⋯</b> 버튼을 먼저 눌러 주세요.</span></li>
        <li><span>목록을 아래로 내려서 <b>홈 화면에 추가</b> <img src="${asURL(icAddBox)}" alt="">를 눌러요.</span></li>

      </ol>${storeNote}${later}`;
  } else if(isAndroid){
    const apk=githubApkUrl();
    h = `<p>홈 화면에 추가하면 앱처럼 전체 화면으로 즐길 수 있어요.</p>

      ${apk?`<p class="small" style="margin-top:10px">설치 파일(APK)로 받고 싶다면</p><button class="btn wide" id="iApk">안드로이드 앱(APK) 받기</button>`:''}

// ================= 이가네 주막 =================
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayNum(){ const d=new Date(); return d.getFullYear()*372+d.getMonth()*31+d.getDate(); }
const specialId = ()=>MENU[dayNum()%MENU.length].id;
const allMenu = ()=> evtIs('bok') ? [...MENU, SAMGYE] : MENU;
const menuPrice = m => m.id===specialId() ? Math.round(m.price*0.6) : m.price;
function minsLeft(ts){ return Math.max(0, Math.ceil((ts-Date.now())/60000)); }
function renderBuffs(){
  const el=$('buffs'); ensureDaily();
  const qd=S.daily.quests.filter(q=>q.done).length;
  let h=`<button class="buff hub${hubAttention()?' new':''}" data-hub="1"><img src="${asURL(icTree,2)}" alt=""><b>Lv ${farmLv()}</b>할 일 ${qd}/${S.daily.quests.length}</button>`;
  if(Date.now()<S.buff.grow) h+=`<span class="buff"><img src="${asURL(FOOD.bbq,2)}" alt="">성장↑ ${minsLeft(S.buff.grow)}분</span>`;
  if(Date.now()<S.buff.gold) h+=`<span class="buff"><img src="${asURL(FOOD.makgeolli,2)}" alt="">황금↑ ${minsLeft(S.buff.gold)}분</span>`;
  if(S.buff.bonus>0) h+=`<span class="buff"><img src="${asURL(FOOD.shrimp,2)}" alt="">수확+2 ${S.buff.bonus}번</span>`;
  const wn=weatherNow();
  if(typhoon && typhoon.phase==='warn') h+=`<span class="buff" style="border-color:#c0392b;background:#ffe3dc"><img src="${asURL(icSwirl,2)}" alt="">태풍까지 ${Math.max(0,Math.ceil((typhoon.hit-Date.now())/1000))}초! 지지대</span>`;
  else if(wn==='typhoon') h+=`<span class="buff"><img src="${asURL(icSwirl,2)}" alt="">태풍이 지나가는 중</span>`;
  else if(wn==='rain') h+=`<span class="buff"><img src="${asURL(icDrop,2)}" alt="">${curSeason==='winter'?'함박눈':'비'} (물 자동)</span>`;
  else if(wn==='rainbow') h+=`<span class="buff"><img src="${asURL(icRainbow,2)}" alt="">무지개 (황금↑)</span>`;
  const ev=activeEvent(); if(ev) h+=`<span class="buff"><img src="${asURL(ev.id==='xmas'?snowman:ev.id==='bok'?FOOD.samgye:icMoonEvt,2)}" alt="">${ev.name} 이벤트</span>`;
  if(el.innerHTML!==h){ el.innerHTML=h; fit(); }
}
function renderJumak(){
  const coin=`<img src="${asURL(icCoin)}" alt="">`;
  const st=S.jumak.stamps%10;
  let h=`<div class="jumak-head"><img src="${asURL(jumakHouse)}" alt=""><div>
    <div>어서 오시게! 농사일에 고생 많았지?</div>
    <small style="opacity:.75">단골 도장 ${st}/10 (다 모으면 서비스 30코인)</small>
    <div class="stamps">${Array.from({length:10},(_,i)=>`<i class="${i<st?'on':''}"></i>`).join('')}</div></div></div>`;
  for(const m of allMenu()){
    const p=menuPrice(m), sp=p!==m.price;
    h+=`<div class="row"><img src="${asURL(FOOD[m.id])}" alt="" style="object-fit:contain"><div class="t"><b>${m.name}</b>${sp?'<span class="badge">오늘의 메뉴</span>':''}
      <small>${m.desc}</small></div>
      <button class="btn" data-m="${m.id}" ${S.coins>=p?'':'disabled'}>${coin}${sp?`<s class="old">${m.price}</s>`:''}${p}</button></div>`;
  }
  openModal('이가네 주막 (코인 '+S.coins+')', h);
  $('mBody').querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>eat(b.dataset.m));
}
function eat(id){
  const m=allMenu().find(x=>x.id===id); if(!m || S.coins<menuPrice(m)){ sfx('no'); return; }
  S.coins-=menuPrice(m);
  const now=Date.now();
  if(id==='makgeolli') S.buff.gold = Math.max(now,S.buff.gold) + 30*60000;
  if(id==='bbq') S.buff.grow = Math.max(now,S.buff.grow) + 60*60000;
  if(id==='shrimp') S.buff.bonus += 3;
  if(id==='samgye'){ S.buff.grow = Math.max(now,S.buff.grow) + 60*60000; }
  if(id==='pajeon' || id==='samgye') S.trees.forEach((t,i)=>{ if(t.u){ t.water=100; if(fieldOf(i)===curField) burst(P(i)[0],P(i)[1],'water',8);} });
  S.jumak.stamps++; S.jumak.eaten[id]=(S.jumak.eaten[id]||0)+1; gainXP(3);
  let service='';
  if(S.jumak.stamps%10===0){ S.coins+=30; service='<p>단골 도장을 다 모았어요! 사장님이 30코인을 챙겨 주셨어요.</p>'; }
  sfx('harvest'); buzz(15); save(); updHud(); renderBuffs();
  openModal('이가네 주막', `<div class="eat"><img src="${asURL(FOOD[id],8)}" alt="${m.name}">
    <p style="font-size:15px;margin:14px 0 4px">냠냠, ${m.name} 맛있다!</p><p style="opacity:.8;margin:0 0 6px">${m.say}</p>${service}
    <button class="btn wide" id="eatBack">한 접시 더 보기</button></div>`);
  $('eatBack').onclick=renderJumak;
}

const attendanceDue = ()=>S.att.last!==todayKey();
function doAttendance(){
  if(!attendanceDue()) return nextModal();
  S.att.last=todayKey(); S.att.count++;
  const idx=(S.att.count-1)%7, c=ATT_REWARD[idx];
  S.coins+=c; let msg=`${c}코인을 받았어요!`;
  if(idx===6){ S.gold+=1; S.stats.gold++; discover('gold',1); msg=`황금 복숭아 1개와 ${c}코인을 받았어요!`; }
  if(evtIs('xmas')){ S.coins+=50; msg+=' 크리스마스 선물로 50코인도 더 받았어요!'; }
  save(); updHud();
  const sp=MENU.find(m=>m.id===specialId());
  openModal(`출석 ${S.att.count}일째`, `<div class="att">${ATT_REWARD.map((r,i)=>`<div class="${i<idx?'on':''} ${i===idx?'today':''}">${i+1}일<br>${i===6?'황금+'+r:r}</div>`).join('')}</div>
    <p style="margin:0 0 6px">${msg}</p>
    <p style="opacity:.8;margin:0">오늘 이가네 주막 할인 메뉴: <b>${sp.name}</b> (40% 할인)</p>
    <button class="btn wide" id="attOk">고마워요</button>`);
  $('attOk').onclick=closeModal;
}

// ================= 마을 의뢰판 =================
function newOrder(){
  const c=CLIENTS[irand(0,CLIENTS.length-1)];
  let want='any', n=irand(6,14);
  if(Math.random()<0.55){ const pool=VARIETIES.filter(v=>v.seasons.includes(curSeason)); want=pool[irand(0,pool.length-1)].id; n=irand(2,6); }
  const unit = want==='any' ? PEACH_PRICE : VAR[want].price;
  return {id:Date.now().toString(36)+irand(0,9999), who:c.who, line:c.line, want, n, reward:Math.round(n*unit*1.9/5)*5+10};
}
function initOrders(){ S.orders=[newOrder(),newOrder()]; S.orderNext=Date.now()+60*60000; S.ordersNew=true; }
function refillOrders(){
  if(evtIs('chuseok') && S.chuseokDay!==todayKey()){
    S.chuseokDay=todayKey(); S.ordersNew=true;
    S.orders.push({id:'cs'+Date.now().toString(36), who:'이장님', line:'추석 선물세트로 {v} {n}개를 보내고 싶네. 넉넉히 쳐 주겠네!', want:'any', n:15, reward:260, special:true});
    save();
  }
  if(S.orders.length<3 && Date.now()>=S.orderNext){ S.orders.push(newOrder()); S.orderNext=Date.now()+90*60000; S.ordersNew=true; save(); }
}
const haveFor = o => o.want==='any' ? peachCount() : (S.inv[o.want]||0);
const ordersAttention = ()=> S.ordersNew || S.orders.some(o=>haveFor(o)>=o.n);
function orderText(o){ return o.line.replace('{v}', o.want==='any'?'복숭아':VAR[o.want].name).replace('{n}', o.n); }
function renderOrders(){
  S.ordersNew=false;
  let h=`<p style="margin:0 0 2px;opacity:.8">마을 사람들의 부탁을 들어주면 시장보다 넉넉하게 쳐 줘요.</p>`;
  if(!S.orders.length) h+='<p>지금은 부탁이 없어요.</p>';
  for(const o of S.orders){
    const hv=haveFor(o), ok=hv>=o.n;
    h+=`<div class="order"><div class="who">${o.who}${o.special?'<span class="badge">추석</span>':''}</div><div class="line">"${orderText(o)}"</div>
      <div class="act"><img src="${asURL(o.want==='any'?icPeach:VAR_IMG[o.want].icon)}" alt=""><span>${Math.min(hv,o.n)} / ${o.n}</span>
      <button class="btn" data-o="${o.id}" ${ok?'':'disabled'}><img src="${asURL(icCoin)}" alt="">${o.reward} 받고 건네기</button>
      <button class="skip" data-x="${o.id}">거절</button></div></div>`;
  }
  if(S.orders.length<3) h+=`<p style="opacity:.7;font-size:12px;margin:8px 0 0">다음 부탁까지 약 ${minsLeft(S.orderNext)}분</p>`;
  openModal('마을 의뢰판', h);
  $('mBody').querySelectorAll('button[data-o]').forEach(b=>b.onclick=()=>fillOrder(b.dataset.o));
  $('mBody').querySelectorAll('button[data-x]').forEach(b=>b.onclick=()=>{
    S.orders=S.orders.filter(o=>o.id!==b.dataset.x); S.orderNext=Math.min(S.orderNext||Infinity, Date.now()+30*60000); save(); renderOrders(); });
}
function fillOrder(id){
  const o=S.orders.find(x=>x.id===id); if(!o || haveFor(o)<o.n) return;
  let need=o.n;
  if(o.want==='any'){
    const ids=Object.keys(S.inv).filter(k=>S.inv[k]>0).sort((a,b)=>VAR[a].price-VAR[b].price);
    for(const k of ids){ const take=Math.min(need,S.inv[k]); S.inv[k]-=take; need-=take; if(!need) break; }
  } else S.inv[o.want]-=need;
  S.coins+=o.reward; S.stats.orders=(S.stats.orders||0)+1; gainXP(15);
  S.orders=S.orders.filter(x=>x!==o); S.orderNext=Math.min(S.orderNext||Infinity, Date.now()+20*60000);
  sfx('coin'); buzz(15); toast(`${o.who}: 고마워요! (+${o.reward}코인)`); save(); updHud(); renderOrders();
}

function checkEvent(){
  const e=activeEvent(); if(!e) return;
  const key=e.id+new Date().getFullYear(); if(S.evtSeen[key]) return;
  S.evtSeen[key]=1; save();
  modalQueue.push(()=>{ openModal(`${e.name} 이벤트가 열렸어요`, `<div class="eat"><img src="${asURL(e.id==='xmas'?snowman:e.id==='bok'?FOOD.samgye:icMoonEvt,8)}" alt="" style="width:80px">
    <p style="margin:12px 0 6px">${e.desc}</p><button class="btn wide" id="evOk">좋아요</button></div>`); $('evOk').onclick=closeModal; });
  if($('modal').hidden && !pendingNext) nextModal();
}
function copyText(text,msg){
  const done=()=>{ toast(msg); sfx('coin'); };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,999);
    let ok=false; try{ ok=document.execCommand('copy') }catch(e){} ta.remove(); ok?done():toast('복사가 안 되면 번호를 길게 눌러 복사해 주세요'); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done,fallback); else fallback();
}
// ================= 밭 이동 =================
const icArrowR = spr(['k....','kk...','kyk..','kyyk.','kyyyk','kyyk.','kyk..','kk...','k....'], {k:'#5a3428',y:'#ff9a80'});
$('icNext').src=asURL(icArrowR); $('icPrev').src=asURL(flip(icArrowR));
function fieldNeeds(f){
  if(f===RANCH_F) return ranchNeeds();
  if(f>=S.fields) return false;
  if(cat && cat.field===f && cat.state==='sleep') return true;
  if(bugs.some(b=>b.field===f)) return true;
  return fieldTrees(f).some(i=>{ const t=S.trees[i]; return t.u && ((t.stage===4&&t.fruit>0) || t.water<35 || (t.stage>=1&&t.prune>=50) || stakeNeeded(t)); });
}
function goField(f){
  const maxF=maxPage();
  f=clamp(f,0,maxF); if(f===curField) return;
  curField=f; S.curField=f; birds=[]; parts=[]; pests=[]; if(cat && cat.prey && cat.prey.kind){ cat.prey=null; if(cat.state==='hunt'){ cat.state='happy'; cat.timer=3; } }
  sfx('pet'); save(); updField();
}
let fieldKey='';
function updField(){
  const maxF=maxPage(); if(curField>maxF){ curField=maxF; S.curField=maxF; }
  const ranch=isRanch();
  const prevNeed = [...Array(curField).keys()].some(fieldNeeds);
  const nextNeed = [...Array(maxF+1).keys()].filter(f=>f>curField).some(fieldNeeds);
  const locked = ranch ? !S.ranch.open : curField>=S.fields, cost = ranch ? RANCH.cost : locked?FIELDS[curField].cost:0;
  const lvReq = ranch ? RANCH.lv : locked?(FIELDS[curField].lv||1):1, lvOk=farmLv()>=lvReq;
  const key=[curField,S.fields,maxF,prevNeed,nextNeed,locked,locked&&S.coins>=cost,lvOk].join();
  if(key===fieldKey) return; fieldKey=key;
  $('fPrev').hidden = curField<=0; $('fNext').hidden = curField>=maxF;
  $('fPrev').classList.toggle('new',prevNeed); $('fNext').classList.toggle('new',nextNeed);
  $('fName').innerHTML = `${ranch?RANCH.name:FIELDS[curField].name}${locked&&!ranch?' (빈 땅)':''} ${[...Array(maxF+1).keys()].map(f=>`<i class="${f===curField?'on':''}"></i>`).join('')}`;
  const L=$('fLock');
  if(locked && ranch){
    L.hidden=false;
    L.innerHTML = `<b>${RANCH.name}</b><small>울타리만 쳐 둔 빈 목장이에요.<br>목장을 열면 닭 두 마리가 이사 와요.<br>닭은 달걀을 낳고, 나중엔 토끼도 키울 수 있어요.</small>
      <button class="btn" id="fBuy" ${S.coins>=cost?'':'disabled'}><img src="${asURL(icCoin)}" alt="">${cost} 목장 열기</button>`;
    $('fBuy').onclick=openRanch;
  } else if(locked){
    L.hidden=false;
    L.innerHTML = `<b>${FIELDS[curField].name}</b><small>풀만 무성한 빈 땅이에요.<br>개척하면 복숭아나무 두 그루를 바로 심어 줘요.</small>
      ${lvOk?`<button class="btn" id="fBuy" ${S.coins>=cost?'':'disabled'}><img src="${asURL(icCoin)}" alt="">${cost} 개척하기</button>`
            :`<button class="btn" id="fBuy" disabled>농장 레벨 ${lvReq}에 열려요</button>`}`;
    $('fBuy').onclick=buyField;
  } else L.hidden=true;
}
$('fPrev').onclick=()=>goField(curField-1);
$('fNext').onclick=()=>goField(curField+1);
curField = S.curField||0;

const catBtn=$('catBtn');
catBtn.innerHTML=`<img src="${asURL(icChuru)}" alt="">츄르 주기 <img src="${asURL(icCoin)}" alt="">${CHURU}`;
catBtn.onclick=feedCat;
const playBtn=$('playBtn');
playBtn.innerHTML=`<img src="${asURL(icFeather)}" alt="">놀아 주기`;
playBtn.onclick=startCatPlay;
function renderSound(){
  const row=(id,icon,name,on,vol)=>`<div class="row"><img src="${asURL(icon)}" alt="" style="object-fit:contain"><div class="t"><b>${name}</b>
      <input type="range" class="vol" id="${id}Vol" min="0" max="100" value="${Math.round(vol*100)}" ${on?'':'disabled'}></div>
      <button class="btn" id="${id}Tog" style="flex-direction:row;min-width:58px;justify-content:center">${on?'켜짐':'꺼짐'}</button></div>`;
  openModal('소리 설정', row('bgm',icNote,'배경음악',!S.bgmOff,bgmVol()) + row('sfx',icSpk,'효과음',!S.muted,sfxVol())
    + `<p class="small" style="margin:10px 0 0">아이폰은 무음 모드가 켜져 있으면 소리가 나지 않을 수 있어요.</p>`);
  $('bgmTog').onclick=()=>{ S.bgmOff=!S.bgmOff; if(S.bgmOff) bgmStop(); else bgmStart(); save(); updHud(); renderSound(); };
  $('sfxTog').onclick=()=>{ S.muted=!S.muted; save(); updHud(); if(!S.muted) sfx('pet'); renderSound(); };
  $('bgmVol').oninput=e=>{ setBgmVol(e.target.value/100); };
  $('bgmVol').onchange=()=>save();
  $('sfxVol').oninput=e=>{ S.sfxVol=e.target.value/100; };
  $('sfxVol').onchange=()=>{ save(); sfx('pet'); };
}
$('bSound').onclick=renderSound;
$('buffs').addEventListener('click', e=>{ if(e.target.closest('[data-hub]')) openHub(); });
$('bShop').onclick=()=>renderShop();
$('bSell').onclick=()=>sellAll();
$('bJumak').onclick=()=>renderJumak();
$('bReal').onclick=()=>renderReal();
$('bInfo').onclick=()=>renderInfo();
$('bHelp').onclick=()=>showHelp();
$('bShare').onclick=()=>shareFarm();
$('icShare').src=asURL(spr(['...kk...','.kkkkkk.','kwwwwwwk','kwwkkwwk','kwkpykwk','kwwkkwwk','kwwwwwwk','.kkkkkk.'],{k:'#5a3428',w:'#ffd9c7',p:'#7cc4f5',y:'#e6f6ff'}));
$('icHelp').src=asURL(spr(['.kkk.','k...k','....k','..kk.','..k..','.....','..k..'],{k:'#5a3428'}));

// ================= 메인 루프 =================
let lastWall=Date.now(), saveT=0, clockT=0;
function update(dt){
  simNow = Date.now(); growTrees(dt, catTree());
  birdTimer-=dt; if(birdTimer<=0){ spawnBirds(); birdTimer=rand(45,90)*(1+0.6*S.up.scare); }
  catTimer-=dt; if(catTimer<=0){ if(!cat) spawnCat(); catTimer = S.cat.aff>=80 ? rand(60,120) : rand(90,180); }
  ranchTick(dt,true); updateAnimals(dt); updatePests(dt);
  updateBirds(dt); updateCat(dt); updateBugs(dt); updateBees(dt); updateVisitors(dt); updateDad(dt); updateStar(dt); updateTteok(dt); updateFairy(dt);
  const showCB = !!(cat && cat.field===curField && !cat.fed && ['enter','sleep','pause','dash'].includes(cat.state));
  if(catBtn.hidden===showCB) catBtn.hidden=!showCB;
  const showPB = !!canCatPlay();
  if(playBtn.hidden===showPB) playBtn.hidden=!showPB;
  if(showPB){ const b=showCB?'52px':'14px'; if(playBtn.style.bottom!==b) playBtn.style.bottom=b; }
  for(const p of parts){ p.life-=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  parts=parts.filter(p=>p.life>0);
  saveT+=dt; if(saveT>5){ saveT=0; save(); }
  clockT+=dt; if(clockT>1){ clockT=0; curSeason=season(); weatherTick(); couponTick(); refillOrders(); updClock(); updHud(); renderBuffs(); updField();
    if(S.seenHelp && Math.random()<0.02) checkEvent();
    if(S.ss && S.ss.found && !dad && S.ss.dadDay!==todayKey() && Math.random()<0.03) spawnDad();
    if(attendanceDue() && modalIdle() && S.seenHelp) doAttendance(); }
}
function welcomeBack(sec){
  const r=simulate(sec);
  if(sec>120){
    const m=Math.round(sec/60), tm = m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`;
    let msg=`${tm} 동안 농장이 자랐어요.`;
    if(r.ripe>0) msg+=` 익은 나무 ${r.ripe}그루!`;
    if(r.thirsty>0) msg+=` 목마른 나무 ${r.thirsty}그루`;
    toast(msg,3600);
  }
}
function frame(){
  const now=Date.now(); let dt=(now-lastWall)/1000; lastWall=now;
  if(dt>2){ welcomeBack(dt); dt=0; }
  update(Math.min(dt,0.1));
  render(now/1000);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ save(); try{ actx&&actx.suspend(); }catch(e){} } else { try{ actx&&actx.resume(); }catch(e){} } });
addEventListener('pagehide',save);

// 시작
ssApply();
welcomeBack((Date.now()-S.last)/1000);
fit(); updHud(); updClock(); updField();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
if(!S.orders.length && !S.orderNext) initOrders();
if(S.seenHelp) checkEvent();
if(S.seenHelp) checkApril();
if(aprilFools()) $('icPeach').src=asURL(icApple);
if(!S.seenHelp) modalQueue.push(showHelp);
if(!S.installSeen && !isStandalone && !isApp && (isIOS || isKakao || (isAndroid && isInApp))) modalQueue.push(showInstallGuide);
if(attendanceDue()) modalQueue.push(doAttendance);
if(REAL_FARM.shopUrl && S.shopNotice!==REAL_FARM.shopUrl) modalQueue.push(showShopNotice);
nextModal();
requestAnimationFrame(frame);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
if(location.protocol==='file:') window.__peach = {S:()=>S, pondTap, moonTap, scareTap, star:()=>star, setStar:v=>{star=v}, starTap, tteok:()=>tteok, checkFairy, fairy:()=>fairy, checkApril, napTap, ssTrigger, ssOpen, openLetter, dad:()=>dad, talkDad, ssGlow, gainXP, openHub, startMini, endMini:()=>endMini(false), mg:()=>mg, cp:()=>cp, startCatPlay, endCatPlay:()=>endCatPlay(false), spawnVisitor, visitors:()=>visitors, shareFarm, levelOf, farmLv, ensureDaily, bugs:()=>bugs, spawnBug, setWeather:w=>{weatherOverride=w}, setEvent:e=>{eventOverride=e}, startTyphoon, typhoonHit, ty:()=>typhoon, checkEvent, couponTick, goField, buyField, field:()=>curField, cat:()=>cat, birds:()=>birds, gifts:()=>gifts, setSeason:s=>{seasonOverride=s;curSeason=s;}, feedCat, newOrder, spawnCat:()=>{ if(!cat) spawnCat(); }, spawnBirds, ranch:()=>S.ranch, pests:()=>pests, spawnMouse, spawnSnake, openRanch, renderRanch, ranchAn:()=>ranchAn, ranchTick, tapPest, ripe:()=>{ S.trees.forEach(t=>{ if(t.u){t.stage=3;advance(t);} }); }};
</script>
